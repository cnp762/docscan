# XcodeGen spec — run `bash scripts/gen-xcconfig.sh && xcodegen generate` on macOS.
name: DocScan
options:
  bundleIdPrefix: cam
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "5.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.6.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 11.13.0
targets:
  DocScan:
    type: application
    platform: iOS
    sources:
      - path: DocScan
        excludes:
          - Resources/Models/**
      - path: DocScan/Resources/Models
        type: folder
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cam.docscan
      INFOPLIST_FILE: DocScan/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0.0"
      CODE_SIGN_ENTITLEMENTS: DocScan/DocScan.entitlements
    info:
      path: DocScan/Info.plist
      properties:
        UILaunchScreen: {}
