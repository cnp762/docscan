services:
  api-docscan:
    build: .
    container_name: api-docscan
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${API_PORT:-3005}:8000"
    networks:
      - default
      - api_default

  # Optional standalone Postgres (for isolated local dev or fresh prod host)
  db:
    image: postgres:16-alpine
    profiles: ["standalone-db"]
    environment:
      POSTGRES_USER: docscan
      POSTGRES_PASSWORD: docscan
      POSTGRES_DB: docscan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docscan"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: cloudflared tunnel to expose api.docscan.cam (prod)
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api-docscan

networks:
  api_default:
    external: true

volumes:
  pgdata:
